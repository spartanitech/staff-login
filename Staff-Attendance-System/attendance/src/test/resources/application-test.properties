# Used by the integration tests only (H2 in MySQL mode instead of a real MySQL server).
spring.datasource.url=jdbc:h2:mem:attendance_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.jwt.secret=integration-test-secret-integration-test-secret-0123456789
app.seed.demo-users=true
app.attendance.photo-dir=${java.io.tmpdir}/attendance-test-photos
