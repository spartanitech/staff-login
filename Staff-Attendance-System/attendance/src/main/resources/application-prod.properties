# Activate with SPRING_PROFILES_ACTIVE=prod.
# Everything sensitive is REQUIRED from the environment: startup fails if it is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Behind a reverse proxy: trust X-Forwarded-For only from private-range proxies
# so the IP recorded for check-ins cannot be spoofed by the client.
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.seed.demo-users=false
