spring.application.name=attendance
server.port=8080

# ---------------------------------------------------------------------------
# Database (MySQL). The defaults below work for a local MySQL on port 3306;
# only the PASSWORD needs to be supplied. Two ways:
#   1) copy application-local.properties.example -> application-local.properties
#      (same folder), fill it in, and run with the "local" profile  [recommended]
#   2) set the DB_URL / DB_USERNAME / DB_PASSWORD environment variables
# NOTE: ${VAR:default} only falls back to the default when the variable is
# ABSENT. A variable that exists but is empty is used as an empty value.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/staff_attendance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Every date/time in this system is Indian Standard Time.
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger UI  ->  http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# JWT signing secret, 32+ characters. If empty, a random one is generated at
# every start (fine for local development: everyone is just signed out on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.issuer=spartan-staff-attendance

# Bootstrap Admin account (created on first start, repaired if it is wrong).
# Local default is Admin / Admin@123 - the prod profile refuses that password.
app.admin.username=${ADMIN_USERNAME:Admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.employee-code=ADM001
# One-off escape hatch: start once with ADMIN_RESET_PASSWORD=true to force the
# Admin password back to app.admin.password, then remove it.
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}

# Only needed when the frontend is opened from a different origin than the
# backend (e.g. VS Code Live Server on :5500). Same-origin (http://localhost:8080) needs nothing.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}

# Local convenience: creates the demo staff (owner01, marketing01, regional01,
# areasales01/02, sales01-03). Forced off in the prod profile.
app.seed.demo-users=${SEED_DEMO_USERS:true}

# ---------------------------------------------------------------------------
# Attendance policy (applied by the server)
# ---------------------------------------------------------------------------
app.attendance.zone=Asia/Kolkata
app.attendance.shift-start=09:30
app.attendance.late-grace-minutes=15
app.attendance.half-day-minutes=240
# Worst GPS accuracy (metres) the server accepts. Phones with GPS give 5-30 m. A laptop/desktop has NO GPS and reports
# an approximate Wi-Fi/IP location (often 100-5000 m): for testing on a PC only, start with MAX_ACCURACY_METERS=5000.
app.attendance.max-accuracy-meters=${MAX_ACCURACY_METERS:100}
app.attendance.weekly-off=SUNDAY

# Sales Officers mark attendance at an assigned SHOP (server-side distance check + a live photo).
# Default 'stand within this many metres of the shop' for a NEW shop; the Admin can set it per shop (10-500 m).
app.attendance.shop-radius-meters=${SHOP_RADIUS_METERS:50}
# Folder where the live check-in photos are kept (outside the web root; only served through the authenticated API).
# In Docker, mount a volume here so photos survive a container rebuild.
app.attendance.photo-dir=${PHOTO_DIR:${user.home}/.staff-attendance/photos}
app.attendance.max-photo-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
