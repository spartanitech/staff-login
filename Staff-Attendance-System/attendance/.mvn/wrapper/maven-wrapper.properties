# Maven Wrapper configuration.
#
# This file was MISSING from the project, which is why ./mvnw and
# mvnw.cmd both failed with:
#   "Cannot find path ...\.mvn\wrapper\maven-wrapper.properties"
#
# The 3.3.4 wrapper reads distributionUrl from here and downloads that
# Maven distribution on first run, so no local Maven install is needed.
# wrapperVersion must match the version in mvnw / mvnw.cmd (3.3.4).
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
